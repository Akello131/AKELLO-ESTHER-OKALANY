<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspiration Source Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login-container">
    <h1 class="brand">Inspiration Source</h1>
    <p class="quote">"Your every day energy."</p>

    <form class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn">Login</button>
    </form>

    <div class="social-links">
      <p>Reach out for more inspiration:</p>
      <a href="https://www.youtube.com/@EstherAkello-d6m" class="youtube">YouTube</a>
      <a href=""https://www.instagram.com/akello640/ class="instagram">Instagram</a>
      <a href="https://www.linkedin.com/in/esther-akello-74036a37b/" class="linkedin">LinkedIn</a>
    </div>
  </div>
</body>
</html>
